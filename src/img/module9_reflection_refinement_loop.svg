<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Explicit refinement loop for agent reasoning</title>
<desc id="desc">A visible refinement workflow transforms user input into a refined query, plan, evidence, draft, evaluator feedback, revised draft, and final output.</desc>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
<style>
.bg{fill:#fff}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eaf2ff;stroke:#2563eb;stroke-width:2.4}.green{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.4}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2.4}.line{stroke:#64748b;stroke-width:2.8;fill:none;marker-end:url(#a)}.loop{stroke:#2563eb;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#b)}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.m{font-family:Arial,Helvetica,sans-serif;fill:#475569}
</style></defs>
<rect class="bg" width="1200" height="690"/>
<text class="t" x="60" y="58" font-size="34" font-weight="700">“More thinking” = more explicit, testable passes</text>
<text class="m" x="60" y="96" font-size="20">Reuse outputs as structured inputs to the next step instead of asking for hidden chain-of-thought.</text>

<rect class="box" x="55" y="170" rx="15" width="150" height="82"/>
<text class="t" x="130" y="204" text-anchor="middle" font-size="18" font-weight="700">User input</text>
<text class="m" x="130" y="230" text-anchor="middle" font-size="14">raw request</text>
<path class="line" d="M205 211 L255 211"/>

<rect class="blue" x="270" y="160" rx="15" width="165" height="102"/>
<text class="t" x="352" y="197" text-anchor="middle" font-size="18" font-weight="700">Refine input</text>
<text class="m" x="352" y="224" text-anchor="middle" font-size="14">clarify · normalize</text>
<text class="m" x="352" y="246" text-anchor="middle" font-size="14">rewrite search query</text>
<path class="line" d="M435 211 L485 211"/>

<rect class="blue" x="500" y="160" rx="15" width="150" height="102"/>
<text class="t" x="575" y="197" text-anchor="middle" font-size="18" font-weight="700">Plan</text>
<text class="m" x="575" y="224" text-anchor="middle" font-size="14">what is needed?</text>
<text class="m" x="575" y="246" text-anchor="middle" font-size="14">which tools?</text>
<path class="line" d="M650 211 L700 211"/>

<rect class="box" x="715" y="160" rx="15" width="165" height="102"/>
<text class="t" x="797" y="197" text-anchor="middle" font-size="18" font-weight="700">Gather evidence</text>
<text class="m" x="797" y="224" text-anchor="middle" font-size="14">RAG · SQL · API</text>
<text class="m" x="797" y="246" text-anchor="middle" font-size="14">web · tools</text>
<path class="line" d="M880 211 L930 211"/>

<rect class="green" x="945" y="160" rx="15" width="190" height="102"/>
<text class="t" x="1040" y="197" text-anchor="middle" font-size="18" font-weight="700">Draft</text>
<text class="m" x="1040" y="224" text-anchor="middle" font-size="14">answer / plan / code</text>
<text class="m" x="1040" y="246" text-anchor="middle" font-size="14">based on evidence</text>

<path class="line" d="M1040 262 L1040 350"/>
<rect class="orange" x="900" y="365" rx="15" width="280" height="110"/>
<text class="t" x="1040" y="402" text-anchor="middle" font-size="19" font-weight="700">Evaluator / critic</text>
<text class="m" x="1040" y="430" text-anchor="middle" font-size="14">correct? complete? grounded?</text>
<text class="m" x="1040" y="453" text-anchor="middle" font-size="14">meets project criteria?</text>

<path class="line" d="M900 420 L820 420"/>
<rect class="blue" x="610" y="365" rx="15" width="195" height="110"/>
<text class="t" x="707" y="402" text-anchor="middle" font-size="19" font-weight="700">Revise</text>
<text class="m" x="707" y="430" text-anchor="middle" font-size="14">use explicit feedback</text>
<text class="m" x="707" y="453" text-anchor="middle" font-size="14">produce improved draft</text>

<path class="loop" d="M707 365 C700 310 870 305 960 325"/>
<text class="m" x="760" y="315" font-size="14">re-evaluate revised output</text>

<path class="line" d="M1040 475 L1040 545"/>
<rect class="green" x="900" y="560" rx="15" width="280" height="78"/>
<text class="t" x="1040" y="594" text-anchor="middle" font-size="19" font-weight="700">Final output / stop</text>
<text class="m" x="1040" y="620" text-anchor="middle" font-size="14">criteria passed or budget reached</text>

<rect class="box" x="65" y="390" rx="15" width="430" height="170"/>
<text class="t" x="90" y="425" font-size="19" font-weight="700">Store visible artifacts in state</text>
<text class="m" x="90" y="458" font-size="16">refined_query</text>
<text class="m" x="90" y="486" font-size="16">plan</text>
<text class="m" x="90" y="514" font-size="16">evidence</text>
<text class="m" x="275" y="458" font-size="16">draft</text>
<text class="m" x="275" y="486" font-size="16">critique</text>
<text class="m" x="275" y="514" font-size="16">revision_count</text>
<text class="m" x="90" y="542" font-size="15">These are inspectable and testable; hidden chain-of-thought is not required.</text>
</svg>