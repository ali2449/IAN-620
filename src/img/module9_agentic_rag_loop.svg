<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Agentic RAG control loop</title>
<desc id="desc">A user question enters agent state, the system decides whether retrieval is needed, uses a retrieval tool, evaluates evidence, optionally rewrites and retrieves again, generates a grounded answer, validates it, and stops.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <style>
    .bg{fill:#fff}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2.2}.accent{fill:#eaf2ff;stroke:#2563eb;stroke-width:2.4}.good{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.4}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2.2}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.loop{stroke:#2563eb;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#a)}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.m{font-family:Arial,Helvetica,sans-serif;fill:#475569}
  </style>
</defs>
<rect class="bg" width="1200" height="640"/>
<text class="t" x="60" y="62" font-size="34" font-weight="700">Agentic RAG adds controlled decisions around retrieval</text>
<text class="m" x="60" y="100" font-size="20">The key difference is not “more AI.” It is a stateful decision loop with explicit tools, checks, and stopping conditions.</text>

<rect class="box" x="70" y="165" rx="16" width="150" height="72"/>
<text class="t" x="145" y="207" text-anchor="middle" font-size="21" font-weight="700">User question</text>
<path class="line" d="M220 201 L285 201"/>

<rect class="accent" x="300" y="150" rx="16" width="170" height="102"/>
<text class="t" x="385" y="190" text-anchor="middle" font-size="21" font-weight="700">Agent state</text>
<text class="m" x="385" y="219" text-anchor="middle" font-size="16">question · evidence</text>
<text class="m" x="385" y="242" text-anchor="middle" font-size="16">steps · limits</text>
<path class="line" d="M470 201 L535 201"/>

<rect class="accent" x="550" y="150" rx="16" width="180" height="102"/>
<text class="t" x="640" y="188" text-anchor="middle" font-size="20" font-weight="700">Decide</text>
<text class="m" x="640" y="217" text-anchor="middle" font-size="16">retrieve?</text>
<text class="m" x="640" y="240" text-anchor="middle" font-size="16">answer? rewrite?</text>

<path class="line" d="M640 252 L640 320"/>
<rect class="box" x="540" y="335" rx="16" width="200" height="80"/>
<text class="t" x="640" y="371" text-anchor="middle" font-size="20" font-weight="700">Retrieval tool</text>
<text class="m" x="640" y="399" text-anchor="middle" font-size="16">vector DB / search</text>

<path class="line" d="M740 375 L815 375"/>
<rect class="warn" x="830" y="330" rx="16" width="210" height="90"/>
<text class="t" x="935" y="366" text-anchor="middle" font-size="20" font-weight="700">Evidence good enough?</text>
<text class="m" x="935" y="397" text-anchor="middle" font-size="16">relevant · sufficient · safe</text>

<path class="line" d="M935 420 L935 485"/>
<rect class="good" x="830" y="500" rx="16" width="210" height="76"/>
<text class="t" x="935" y="534" text-anchor="middle" font-size="20" font-weight="700">Generate + validate</text>
<text class="m" x="935" y="560" text-anchor="middle" font-size="16">grounded answer → stop</text>

<path class="loop" d="M830 360 C740 300 740 505 585 505 C465 505 440 445 505 405"/>
<rect class="box" x="300" y="445" rx="16" width="190" height="80"/>
<text class="t" x="395" y="479" text-anchor="middle" font-size="20" font-weight="700">Rewrite query</text>
<text class="m" x="395" y="507" text-anchor="middle" font-size="16">then retrieve again</text>
<path class="loop" d="M490 485 C535 485 555 450 585 415"/>

<text class="m" x="75" y="602" font-size="18">Every loop should have a maximum-step limit and a clear stop condition.</text>
</svg>