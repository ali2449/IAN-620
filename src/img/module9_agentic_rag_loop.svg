<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Agentic RAG control loop</title>
<desc id="desc">A user question enters agent state, the controller chooses an approved action, retrieves evidence, grades the evidence, generates and validates when evidence is sufficient, or rewrites the query and retrieves again when evidence is weak.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
  </marker>
  <style>
    .bg{fill:#fff}
    .box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2.2}
    .accent{fill:#eaf2ff;stroke:#2563eb;stroke-width:2.4}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2.4}
    .good{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.4}
    .line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .loop{stroke:#2563eb;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#arrowBlue)}
    .t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
    .m{font-family:Arial,Helvetica,sans-serif;fill:#475569}
    .label{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;fill:#475569}
    .labelYes{fill:#15803d}
    .labelNo{fill:#c2410c}
  </style>
</defs>

<rect class="bg" width="1200" height="680"/>

<text class="t" x="60" y="60" font-size="34" font-weight="700">Agentic RAG = a bounded decision loop around retrieval</text>
<text class="m" x="60" y="98" font-size="20">The system retrieves evidence, checks whether it is good enough, and either generates or deliberately corrects the search.</text>

<!-- Top row -->
<rect class="box" x="70" y="155" rx="16" width="160" height="78"/>
<text class="t" x="150" y="190" text-anchor="middle" font-size="20" font-weight="700">User question</text>
<text class="m" x="150" y="216" text-anchor="middle" font-size="15">original intent</text>

<path class="line" d="M230 194 L290 194"/>

<rect class="accent" x="305" y="140" rx="16" width="190" height="108"/>
<text class="t" x="400" y="179" text-anchor="middle" font-size="21" font-weight="700">Agent state</text>
<text class="m" x="400" y="208" text-anchor="middle" font-size="16">question · evidence</text>
<text class="m" x="400" y="233" text-anchor="middle" font-size="16">steps · limits · route</text>

<path class="line" d="M495 194 L555 194"/>

<rect class="accent" x="570" y="140" rx="16" width="210" height="108"/>
<text class="t" x="675" y="179" text-anchor="middle" font-size="21" font-weight="700">Choose next action</text>
<text class="m" x="675" y="208" text-anchor="middle" font-size="16">retrieve · generate</text>
<text class="m" x="675" y="233" text-anchor="middle" font-size="16">rewrite · stop</text>

<!-- Down to retrieval -->
<path class="line" d="M675 248 L675 310"/>

<!-- Corrective loop row -->
<rect class="box" x="565" y="325" rx="16" width="220" height="92"/>
<text class="t" x="675" y="363" text-anchor="middle" font-size="20" font-weight="700">Retrieve evidence</text>
<text class="m" x="675" y="392" text-anchor="middle" font-size="16">vector DB · search · API</text>

<path class="line" d="M785 371 L845 371"/>

<rect class="warn" x="860" y="322" rx="16" width="245" height="98"/>
<text class="t" x="982" y="360" text-anchor="middle" font-size="20" font-weight="700">Evidence good enough?</text>
<text class="m" x="982" y="389" text-anchor="middle" font-size="16">relevant · sufficient</text>
<text class="m" x="982" y="412" text-anchor="middle" font-size="16">authoritative · current</text>

<!-- Yes path -->
<text class="label labelYes" x="998" y="450">YES</text>
<path class="line" d="M982 420 L982 492"/>

<rect class="good" x="860" y="510" rx="16" width="245" height="92"/>
<text class="t" x="982" y="548" text-anchor="middle" font-size="20" font-weight="700">Generate + validate</text>
<text class="m" x="982" y="577" text-anchor="middle" font-size="16">grounded answer → stop</text>

<!-- No path -->
<text class="label labelNo" x="823" y="445">NO</text>
<path class="loop" d="M860 392 L815 392 L815 556 L785 556"/>

<rect class="box" x="565" y="510" rx="16" width="220" height="92"/>
<text class="t" x="675" y="548" text-anchor="middle" font-size="20" font-weight="700">Rewrite query</text>
<text class="m" x="675" y="577" text-anchor="middle" font-size="16">change the search strategy</text>

<!-- Clean return path directly upward -->
<path class="loop" d="M650 510 L650 435"/>
<text class="m" x="516" y="468" font-size="15">retrieve again</text>

<!-- Footer -->
<rect class="box" x="70" y="535" rx="14" width="400" height="68"/>
<text class="t" x="90" y="563" font-size="18" font-weight="700">Hard rule</text>
<text class="m" x="90" y="588" font-size="16">Every cycle needs a maximum-step limit and a safe exit.</text>

<text class="m" x="70" y="646" font-size="16">The correction loop changes something: query, source, filter, or strategy. Repeating the same failed action is not correction.</text>
</svg>