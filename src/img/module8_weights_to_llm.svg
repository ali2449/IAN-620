<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc">
<title id="title">From a tiny neural network to an LLM</title>
<desc id="desc">A compact comparison showing that both a tiny neural network and a large language model transform numeric representations using learned weights.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
  </marker>
  <style>
    .bg{fill:#ffffff}
    .panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
    .box{fill:#ffffff;stroke:#334155;stroke-width:2}
    .accent{fill:#eaf2ff;stroke:#2563eb;stroke-width:2.2}
    .line{stroke:#64748b;stroke-width:2.6;fill:none;marker-end:url(#arrow)}
    .t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}
    .m{font-family:Arial,Helvetica,sans-serif;fill:#475569}
  </style>
</defs>

<rect class="bg" width="600" height="500"/>

<rect class="panel" x="18" y="18" rx="16" width="270" height="448"/>
<text class="t" x="153" y="58" text-anchor="middle" font-size="24" font-weight="700">Tiny neural network</text>

<rect class="box" x="68" y="92" rx="12" width="170" height="58"/>
<text class="t" x="153" y="128" text-anchor="middle" font-size="20" font-weight="700">numeric input x</text>

<path class="line" d="M153 150 L153 190"/>

<rect class="accent" x="58" y="198" rx="12" width="190" height="82"/>
<text class="t" x="153" y="231" text-anchor="middle" font-size="20" font-weight="700">weight matrix W</text>
<text class="m" x="153" y="258" text-anchor="middle" font-size="17">+ bias b + activation</text>

<path class="line" d="M153 280 L153 320"/>

<rect class="box" x="68" y="328" rx="12" width="170" height="58"/>
<text class="t" x="153" y="364" text-anchor="middle" font-size="20" font-weight="700">hidden vector h</text>

<path class="line" d="M153 386 L153 417"/>
<text class="m" x="153" y="447" text-anchor="middle" font-size="17">repeat layers → output</text>

<rect class="panel" x="312" y="18" rx="16" width="270" height="448"/>
<text class="t" x="447" y="58" text-anchor="middle" font-size="24" font-weight="700">Large language model</text>

<rect class="box" x="362" y="82" rx="12" width="170" height="58"/>
<text class="t" x="447" y="118" text-anchor="middle" font-size="20" font-weight="700">token IDs</text>

<path class="line" d="M447 140 L447 174"/>

<rect class="accent" x="352" y="182" rx="12" width="190" height="72"/>
<text class="t" x="447" y="213" text-anchor="middle" font-size="20" font-weight="700">embedding weights</text>
<text class="m" x="447" y="238" text-anchor="middle" font-size="16">create token vectors</text>

<path class="line" d="M447 254 L447 288"/>

<rect class="accent" x="342" y="296" rx="12" width="210" height="86"/>
<text class="t" x="447" y="328" text-anchor="middle" font-size="20" font-weight="700">Transformer blocks</text>
<text class="m" x="447" y="354" text-anchor="middle" font-size="16">attention + feed-forward</text>

<path class="line" d="M447 382 L447 414"/>
<text class="t" x="447" y="446" text-anchor="middle" font-size="19" font-weight="700">hidden state → logits</text>

<text class="m" x="300" y="492" text-anchor="middle" font-size="16">Both use learned weights to transform numbers into new representations.</text>
</svg>