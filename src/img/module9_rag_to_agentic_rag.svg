<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Classic RAG compared with Agentic RAG</title>
<desc id="desc">Classic RAG follows a fixed retrieve then generate pipeline. Agentic RAG adds routing, grading, rewriting, multiple tools, and bounded loops.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<style>
.bg{fill:#fff}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2.2}.accent{fill:#eaf2ff;stroke:#2563eb;stroke-width:2.4}.good{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.4}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2.4}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.dash{stroke:#2563eb;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#a)}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.m{font-family:Arial,Helvetica,sans-serif;fill:#475569}
</style>
<rect class="bg" width="1200" height="700"/>
<text class="t" x="60" y="58" font-size="34" font-weight="700">Classic RAG vs. Agentic RAG</text>
<text class="m" x="60" y="96" font-size="20">The difference is control flow, not a different vector database.</text>

<text class="t" x="60" y="150" font-size="23" font-weight="700">Classic RAG — fixed pipeline</text>
<rect class="box" x="70" y="180" rx="14" width="170" height="78"/><text class="t" x="155" y="225" text-anchor="middle" font-size="19" font-weight="700">Question</text>
<path class="line" d="M240 219 L315 219"/>
<rect class="accent" x="330" y="180" rx="14" width="190" height="78"/><text class="t" x="425" y="215" text-anchor="middle" font-size="19" font-weight="700">Retrieve once</text><text class="m" x="425" y="240" text-anchor="middle" font-size="15">top-k chunks</text>
<path class="line" d="M520 219 L595 219"/>
<rect class="box" x="610" y="180" rx="14" width="190" height="78"/><text class="t" x="705" y="215" text-anchor="middle" font-size="19" font-weight="700">Build prompt</text><text class="m" x="705" y="240" text-anchor="middle" font-size="15">question + context</text>
<path class="line" d="M800 219 L875 219"/>
<rect class="good" x="890" y="180" rx="14" width="210" height="78"/><text class="t" x="995" y="225" text-anchor="middle" font-size="19" font-weight="700">Generate answer</text>

<text class="t" x="60" y="355" font-size="23" font-weight="700">Agentic RAG — retrieval inside a bounded decision loop</text>
<rect class="box" x="70" y="390" rx="14" width="150" height="78"/><text class="t" x="145" y="435" text-anchor="middle" font-size="19" font-weight="700">Question</text>
<path class="line" d="M220 429 L280 429"/>
<rect class="accent" x="295" y="390" rx="14" width="170" height="78"/><text class="t" x="380" y="425" text-anchor="middle" font-size="19" font-weight="700">Route / decide</text><text class="m" x="380" y="450" text-anchor="middle" font-size="15">what next?</text>
<path class="line" d="M465 429 L525 429"/>
<rect class="accent" x="540" y="390" rx="14" width="170" height="78"/><text class="t" x="625" y="425" text-anchor="middle" font-size="19" font-weight="700">Retrieve / tool</text><text class="m" x="625" y="450" text-anchor="middle" font-size="15">Chroma · web · API</text>
<path class="line" d="M710 429 L770 429"/>
<rect class="warn" x="785" y="385" rx="14" width="210" height="88"/><text class="t" x="890" y="421" text-anchor="middle" font-size="19" font-weight="700">Evidence enough?</text><text class="m" x="890" y="450" text-anchor="middle" font-size="15">grade / validate</text>
<path class="line" d="M995 429 L1045 429"/>
<rect class="good" x="1060" y="390" rx="14" width="110" height="78"/><text class="t" x="1115" y="425" text-anchor="middle" font-size="17" font-weight="700">Generate</text><text class="m" x="1115" y="450" text-anchor="middle" font-size="14">then stop</text>

<rect class="box" x="540" y="535" rx="14" width="170" height="78"/><text class="t" x="625" y="570" text-anchor="middle" font-size="19" font-weight="700">Rewrite / correct</text><text class="m" x="625" y="595" text-anchor="middle" font-size="15">change strategy</text>
<path class="dash" d="M785 459 C755 505 720 530 690 535"/>
<path class="dash" d="M625 535 L625 485"/>

<text class="m" x="60" y="655" font-size="18">Use Agentic RAG when retrieval needs conditional decisions, multiple sources, correction, or verification. Otherwise classic RAG is usually simpler.</text>
</svg>