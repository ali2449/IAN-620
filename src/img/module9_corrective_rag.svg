<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Corrective RAG workflow</title>
<desc id="desc">A question is retrieved against documents, retrieved evidence is graded, good evidence goes to generation, while weak evidence causes query rewriting and another retrieval attempt.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
<style>.bg{fill:#fff}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2.2}.accent{fill:#eaf2ff;stroke:#2563eb;stroke-width:2.4}.good{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.4}.warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2.3}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}.loop{stroke:#2563eb;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#a)}.t{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.m{font-family:Arial,Helvetica,sans-serif;fill:#475569}</style></defs>
<rect class="bg" width="1200" height="620"/>
<text class="t" x="60" y="62" font-size="34" font-weight="700">Corrective RAG: do not trust the first retrieval automatically</text>
<text class="m" x="60" y="100" font-size="20">Retrieve, grade evidence, correct the query when needed, then generate from evidence that passed the check.</text>
<rect class="box" x="80" y="210" rx="16" width="150" height="78"/><text class="t" x="155" y="255" text-anchor="middle" font-size="21" font-weight="700">Question</text>
<path class="line" d="M230 249 L310 249"/>
<rect class="accent" x="325" y="195" rx="16" width="180" height="108"/><text class="t" x="415" y="235" text-anchor="middle" font-size="21" font-weight="700">Retrieve</text><text class="m" x="415" y="266" text-anchor="middle" font-size="16">top-k chunks</text>
<path class="line" d="M505 249 L585 249"/>
<rect class="warn" x="600" y="190" rx="16" width="210" height="118"/><text class="t" x="705" y="231" text-anchor="middle" font-size="21" font-weight="700">Grade evidence</text><text class="m" x="705" y="260" text-anchor="middle" font-size="16">relevant?</text><text class="m" x="705" y="284" text-anchor="middle" font-size="16">enough to answer?</text>
<path class="line" d="M810 225 L900 170"/>
<text class="m" x="847" y="183" font-size="16">good</text>
<rect class="good" x="915" y="120" rx="16" width="190" height="90"/><text class="t" x="1010" y="158" text-anchor="middle" font-size="21" font-weight="700">Generate</text><text class="m" x="1010" y="186" text-anchor="middle" font-size="16">answer + citation</text>
<path class="line" d="M705 308 L705 390"/>
<text class="m" x="720" y="356" font-size="16">weak</text>
<rect class="box" x="600" y="405" rx="16" width="210" height="90"/><text class="t" x="705" y="443" text-anchor="middle" font-size="21" font-weight="700">Rewrite query</text><text class="m" x="705" y="472" text-anchor="middle" font-size="16">make retrieval more specific</text>
<path class="loop" d="M600 450 C520 450 480 370 430 305"/>
<text class="m" x="60" y="566" font-size="18">Correction is useful only when it is bounded: limit retries and fail safely when evidence remains insufficient.</text>
</svg>