name: Patch Module 6 audio and caption names

on:
  push:
    paths:
      - .github/workflows/patch-module6-audio-caption-names.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update s_module6 paths
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('s_module6.html')
          s = p.read_text(encoding='utf-8')

          # Audio/caption files are directly under audio/ and captions/
          # with names like s_module6_slide_01.mp3 and s_module6_slide_01.vtt.
          s = s.replace("const AUDIO_FOLDER = 'audio/s_module6';", "const AUDIO_FOLDER = 'audio';")
          s = s.replace("const CAPTION_FOLDER = 'captions/s_module6';", "const CAPTION_FOLDER = 'captions';")
          s = s.replace("const AUDIO_FOLDER = 'audio/M6';", "const AUDIO_FOLDER = 'audio';")
          s = s.replace("const CAPTION_FOLDER = 'caption/M6';", "const CAPTION_FOLDER = 'captions';")

          replacements = {
              'audio/s_module6/M_slide_': 'audio/s_module6_slide_',
              'captions/s_module6/M_slide_': 'captions/s_module6_slide_',
              'audio/M6/M_slide_': 'audio/s_module6_slide_',
              'caption/M6/M_slide_': 'captions/s_module6_slide_',
              'caption/M_slide_': 'captions/s_module6_slide_',
              'captions/M_slide_': 'captions/s_module6_slide_',
              'audio/M_slide_': 'audio/s_module6_slide_',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)

          s = s.replace('data-file="M_slide_', 'data-file="s_module6_slide_')

          # If any old dynamic fileBase fallback remains, update it too.
          s = s.replace("return slide.dataset.file || `M_slide_${String(current + 1).padStart(2,'0')}`;",
                        "return slide.dataset.file || `s_module6_slide_${String(current + 1).padStart(2,'0')}`;")

          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-module6-audio-caption-names.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s_module6.html .github/workflows/patch-module6-audio-caption-names.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use s_module6 audio and caption file names"
          git push
