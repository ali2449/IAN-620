name: Patch Module 6 default display state

on:
  push:
    paths:
      - .github/workflows/patch-module6-default-state-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply default state and auto-hide toggle patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('s_module6.html')
          s = p.read_text(encoding='utf-8')

          run_btn = '<button class="primary" onclick="runSlide()">Run slide ▶</button>'
          auto_btn = '<button id="autoHideBtn" type="button" onclick="toggleAutoHide()">Auto-hide Off</button>'
          if 'id="autoHideBtn"' not in s and run_btn in s:
              s = s.replace(run_btn, run_btn + '\n' + auto_btn, 1)

          cc_line = "  let ccOpen = localStorage.getItem('ian620_module6_cc') !== 'closed';"
          if 'ian620_module6_defaults_v4' not in s and cc_line in s:
              defaults = "\n".join([
                  "  // Default display state for Module 6.",
                  "  if (localStorage.getItem('ian620_module6_defaults_v4') !== 'done') {",
                  "    localStorage.setItem('ian620_module6_autohide', 'off');",
                  "    localStorage.setItem('ian620_module6_cc', 'open');",
                  "    localStorage.setItem('ian620_module6_narration', 'on');",
                  "    localStorage.setItem('ian620_module6_defaults_v4', 'done');",
                  "  }",
                  "  let autoHide = localStorage.getItem('ian620_module6_autohide') === 'on';",
                  cc_line
              ])
              s = s.replace(cc_line, defaults, 1)
          elif "let autoHide = localStorage.getItem('ian620_module6_autohide') === 'on';" not in s and cc_line in s:
              s = s.replace(cc_line, "  let autoHide = localStorage.getItem('ian620_module6_autohide') === 'on';\n" + cc_line, 1)

          cap_line = "  const captionStrip = document.getElementById('captionStrip');"
          if 'function toggleAutoHide()' not in s and cap_line in s:
              js = "\n".join([
                  cap_line,
                  "  const autoHideBtn = document.getElementById('autoHideBtn');",
                  "",
                  "  function syncDisplayState() {",
                  "    document.body.classList.toggle('auto-hide', autoHide);",
                  "    document.body.classList.toggle('cc-off', !ccOpen);",
                  "    if (autoHideBtn) {",
                  "      autoHideBtn.textContent = autoHide ? 'Auto-hide On' : 'Auto-hide Off';",
                  "      autoHideBtn.setAttribute('aria-pressed', autoHide ? 'true' : 'false');",
                  "      autoHideBtn.title = autoHide ? 'Auto-hide is on. Hover near the bottom to show controls.' : 'Auto-hide is off. The full bottom panel stays visible.';",
                  "    }",
                  "    if (ccBtn) {",
                  "      ccBtn.textContent = ccOpen ? 'CC On' : 'CC Off';",
                  "      ccBtn.setAttribute('aria-pressed', ccOpen ? 'true' : 'false');",
                  "      ccBtn.classList.toggle('primary', ccOpen);",
                  "    }",
                  "    if (captionStrip && !ccOpen) { captionStrip.textContent = ''; captionStrip.classList.add('off'); }",
                  "  }",
                  "",
                  "  function toggleAutoHide() {",
                  "    autoHide = !autoHide;",
                  "    localStorage.setItem('ian620_module6_autohide', autoHide ? 'on' : 'off');",
                  "    syncDisplayState();",
                  "  }",
                  "  window.toggleAutoHide = toggleAutoHide;",
                  "  syncDisplayState();"
              ])
              s = s.replace(cap_line, js, 1)

          cc_store = "localStorage.setItem('ian620_module6_cc', ccOpen ? 'open' : 'closed');"
          if cc_store in s and 'syncDisplayState();\n    if (!ccOpen && captionStrip)' not in s:
              s = s.replace(cc_store, cc_store + "\n    syncDisplayState();\n    if (!ccOpen && captionStrip) { captionStrip.textContent = ''; captionStrip.classList.add('off'); }", 1)

          css_lines = [
              '<style id="ian620-default-display-fix">',
              'body.cc-off .caption-strip{display:none!important}',
              'body:not(.auto-hide) .deck{height:calc(100vh - 50px - 148px)!important;min-height:0!important;padding:10px 0!important;overflow:hidden!important}',
              'body:not(.auto-hide).cc-off .deck{height:calc(100vh - 50px - 108px)!important}',
              'body:not(.auto-hide) .slide{height:100%!important;max-height:none!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important}',
              'body:not(.auto-hide) .bottom,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open){height:148px!important;display:grid!important;grid-template-columns:92px minmax(580px,1fr) minmax(300px,360px) 72px!important;gap:12px!important;align-items:center!important;padding:7px 14px 9px!important;background:var(--panel)!important;border-top:1px solid var(--line)!important;box-shadow:none!important;overflow:visible!important}',
              'body:not(.auto-hide).cc-off .bottom,body:not(.auto-hide).cc-off .bottom:not(:hover):not(:focus-within):not(.force-open){height:108px!important}',
              'body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-block::after{content:none!important;display:none!important}',
              'body:not(.auto-hide) .footer-left,body:not(.auto-hide) .footer-right,body:not(.auto-hide) .narration-controls,body:not(.auto-hide) .audio-player,body:not(.auto-hide) .bottom-nav,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-left,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-right,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) .narration-controls,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-player,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) .bottom-nav{opacity:1!important;visibility:visible!important;transform:none!important;max-height:none!important;pointer-events:auto!important;overflow:visible!important}',
              'body:not(.auto-hide) .audio-block,body:not(.auto-hide) .bottom-nav{display:grid!important}',
              'body:not(.auto-hide) .footer-left,body:not(.auto-hide) .footer-right,body:not(.auto-hide) .narration-controls,body:not(.auto-hide) .audio-player{display:flex!important}',
              'body.auto-hide .deck{height:calc(100vh - 50px - 52px)!important;min-height:0!important;padding:10px 0!important;overflow:hidden!important}',
              'body.auto-hide.cc-off .deck{height:calc(100vh - 50px - 18px)!important}',
              'body.auto-hide .slide{height:100%!important;max-height:none!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important}',
              'body.auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open){height:52px!important;display:grid!important;grid-template-columns:1fr!important;gap:0!important;padding:7px 14px 8px!important;overflow:hidden!important}',
              'body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open){height:18px!important;padding:4px 14px!important;background:transparent!important;border-top:0!important;box-shadow:none!important}',
              'body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .caption-strip,body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .narration-controls,body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-player,body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .bottom-nav,body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-left,body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-right{display:none!important}',
              'body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-block::after{content:""!important;display:block!important;width:160px!important;height:4px!important;margin:4px auto 0!important;border-radius:999px!important;background:rgba(23,100,166,.55)!important}',
              'body.auto-hide .bottom:hover,body.auto-hide .bottom:focus-within,body.auto-hide .bottom.force-open{height:148px!important;display:grid!important;grid-template-columns:92px minmax(580px,1fr) minmax(300px,360px) 72px!important;gap:12px!important;align-items:center!important;padding:7px 14px 9px!important;background:var(--panel)!important;border-top:1px solid var(--line)!important;box-shadow:0 -18px 46px rgba(15,23,42,.16)!important}',
              'body.auto-hide.cc-off .bottom:hover,body.auto-hide.cc-off .bottom:focus-within,body.auto-hide.cc-off .bottom.force-open{height:108px!important}',
              '@media(max-width:1380px) and (min-width:900px){body:not(.auto-hide) .bottom,body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open),body.auto-hide .bottom:hover,body.auto-hide .bottom:focus-within,body.auto-hide .bottom.force-open{grid-template-columns:90px minmax(520px,1fr) minmax(270px,320px) 70px!important;gap:10px!important}}',
              '</style>'
          ]
          css = '\n'.join(css_lines)
          start = s.find('<style id="ian620-default-display-fix">')
          if start != -1:
              end = s.find('</style>', start)
              if end == -1:
                  raise SystemExit('Default display style block has no closing tag')
              s = s[:start] + css + s[end + len('</style>'):]
          else:
              s = s.replace('</head>', css + '\n</head>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-module6-default-state-v4.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s_module6.html .github/workflows/patch-module6-default-state-v4.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Set Module 6 default display state"
          git push
