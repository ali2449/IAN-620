name: Patch Module 6 footer state final 2

on:
  push:
    paths:
      - .github/workflows/patch-module6-footer-state-final2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch s_module6.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('s_module6.html')
          s = p.read_text(encoding='utf-8')
          marker = '<style id="ian620-auto-hide-footer">'
          start = s.find(marker)
          if start != -1:
              end = s.find('</style>', start)
              if end == -1:
                  raise SystemExit('Found auto-hide style start but no closing style tag')
              s = s[:start] + s[end + len('</style>'):]
          css = '''<style id="ian620-footer-state-final-fix">
          body:not(.auto-hide) .bottom,
          body:not(.auto-hide) .bottom:not(:hover):not(:focus-within):not(.force-open) {
            height:148px !important;
            display:grid !important;
            grid-template-columns:92px minmax(580px,1fr) minmax(300px,360px) 72px !important;
            gap:12px !important;
            align-items:center !important;
            padding:7px 14px 9px !important;
            overflow:visible !important;
            background:var(--panel) !important;
            border-top:1px solid var(--line) !important;
            box-shadow:none !important;
          }
          body:not(.auto-hide).cc-off .bottom,
          body:not(.auto-hide).cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) { height:108px !important; }
          body:not(.auto-hide) .footer-left,
          body:not(.auto-hide) .footer-right,
          body:not(.auto-hide) .narration-controls,
          body:not(.auto-hide) .audio-player,
          body:not(.auto-hide) .bottom-nav,
          body:not(.auto-hide) .caption-strip {
            opacity:1 !important;
            visibility:visible !important;
            transform:none !important;
            max-height:none !important;
            pointer-events:auto !important;
          }
          body:not(.auto-hide) .footer-left,
          body:not(.auto-hide) .footer-right,
          body:not(.auto-hide) .narration-controls,
          body:not(.auto-hide) .audio-player { display:flex !important; }
          body:not(.auto-hide) .audio-block,
          body:not(.auto-hide) .bottom-nav { display:grid !important; }
          body:not(.auto-hide) .caption-strip { display:flex !important; }
          body.cc-off .caption-strip { display:none !important; }
          body.auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) {
            height:52px !important;
            display:grid !important;
            grid-template-columns:1fr !important;
            gap:0 !important;
            overflow:hidden !important;
          }
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) {
            height:18px !important;
            background:transparent !important;
            border-top:0 !important;
            box-shadow:none !important;
          }
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .caption-strip,
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .narration-controls,
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-player,
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .bottom-nav,
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-left,
          body.auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-right { display:none !important; }
          </style>'''
          fm = '<style id="ian620-footer-state-final-fix">'
          start = s.find(fm)
          if start != -1:
              end = s.find('</style>', start)
              if end == -1:
                  raise SystemExit('Found final fix style start but no closing style tag')
              s = s[:start] + css + s[end + len('</style>'):]
          else:
              s = s.replace('</head>', css + '\n</head>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflows
        run: |
          rm -f .github/workflows/patch-module6-footer-state-final2.yml
          rm -f .github/workflows/patch-module6-footer-state-final.yml
          rm -f .github/workflows/patch-module6-default-state-v4.yml
          rm -f .github/workflows/patch-module6-autohide-toggle.yml
          rm -f .github/workflows/patch-module6-autohide-toggle2.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s_module6.html .github/workflows/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Module 6 footer state behavior"
          git push
