name: Patch Module 6 small-screen layout

on:
  push:
    paths:
      - .github/workflows/patch-s-module6-small-screen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply small-screen layout patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('s_module6.html')
          s = p.read_text(encoding='utf-8')

          css = r'''<style id="ian620-small-screen-fix">
  /* Compact presentation layout: matches the IAN 603 slide shell on smaller laptop screens. */
  @media (max-width: 1700px) and (min-width: 1000px) {
    :root { --topH:52px; --bottomH:166px; }
    html, body { height:100%; }
    body { overflow:hidden; padding-bottom:0; }

    .topbar {
      height:52px;
      min-height:52px;
      padding:0 14px;
      gap:10px;
      flex-wrap:nowrap;
    }
    .brand {
      width:32px;
      height:32px;
      flex-basis:32px;
      border-radius:9px;
      font-size:12px;
    }
    .title-wrap { min-width:250px; }
    .mod-title { font-size:17px; line-height:1.05; }
    .course { font-size:11px; margin-top:1px; }
    .status { margin-left:auto; width:auto; order:initial; }
    .ready { font-size:12px; }
    .progress-pill {
      min-height:38px;
      padding:7px 12px;
      border-radius:10px;
      gap:9px;
    }
    .top-actions {
      width:auto;
      order:initial;
      margin-left:0;
      gap:8px;
      flex-wrap:nowrap;
    }
    .top-actions button {
      min-height:38px;
      padding:7px 12px;
      border-radius:10px;
      white-space:nowrap;
    }

    .deck {
      height:calc(100vh - 52px - 166px);
      min-height:0;
      padding:22px 0 22px;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    body.cc-off .deck { height:calc(100vh - 52px - 124px); }

    .slide {
      width:min(1390px, calc(100vw - 280px));
      max-width:1390px;
      height:100%;
      max-height:660px;
      min-height:0;
      padding:52px 52px 46px;
      overflow-y:auto;
      overflow-x:hidden;
      border-radius:18px;
      scrollbar-width:thin;
    }
    .slide::after { right:26px; bottom:10px; }

    h1 { font-size:clamp(38px, 3.1vw, 52px); }
    .lead { font-size:clamp(22px, 1.55vw, 28px); }
    p, li { font-size:clamp(18px, 1.12vw, 21px); }
    .sentence-box p { font-size:clamp(26px, 1.75vw, 34px); }

    .bottom {
      height:166px;
      display:grid;
      grid-template-columns:92px minmax(620px,1fr) minmax(310px,360px) 72px;
      gap:14px;
      align-items:center;
      padding:8px 16px 12px;
      background:var(--panel);
      border-top:1px solid var(--line);
    }
    body.cc-off .bottom { height:124px; }

    .footer-left,
    .footer-right { display:flex; align-items:center; justify-content:center; }
    .nav-button {
      height:42px;
      min-height:42px;
      padding:8px 12px;
      font-size:16px;
      border-radius:9px;
      white-space:nowrap;
    }

    .audio-block { min-width:0; display:grid; gap:6px; }
    .narration-controls {
      margin:0;
      max-width:none;
      display:flex;
      gap:6px;
      align-items:center;
      flex-wrap:nowrap;
    }
    .narration-btn,
    .narration-speed {
      min-height:32px;
      padding:5px 9px;
      border-radius:8px;
      font-size:11px;
      font-weight:800;
      white-space:nowrap;
    }

    .caption-strip {
      min-height:44px;
      height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0;
      padding:6px 16px;
      white-space:normal;
      text-align:center;
      font-size:15px;
      line-height:1.35;
    }
    body.cc-off .caption-strip { display:none; }

    .audio-player {
      height:40px;
      display:grid;
      grid-template-columns:auto auto minmax(160px,1fr) auto auto;
      align-items:center;
      gap:8px;
      padding:5px 8px;
      border-radius:10px;
    }
    .audio-title { font-size:11px; font-weight:850; white-space:nowrap; }
    .audio-seek { width:100%; min-width:120px; }
    .audio-time { font-size:10px; white-space:nowrap; }
    .audio-play { font-size:11px; padding:5px 9px; }

    .bottom-nav {
      display:grid;
      gap:7px;
      align-self:center;
    }
    .bottom-nav #slideSelect {
      width:100%;
      max-width:none;
      min-height:40px;
      padding:7px 10px;
      font-size:16px;
      border-radius:8px;
    }
    .bottom-progress {
      display:flex;
      align-items:center;
      gap:8px;
    }
    .bottom-progress .mini-progress { flex:1; height:7px; }
    .bottom-progress .counter {
      min-width:48px;
      text-align:right;
      font-size:11px;
      font-weight:900;
    }

    .transcript-panel {
      right:22px;
      bottom:178px;
      width:min(560px, calc(100vw - 44px));
      max-height:min(520px, calc(100vh - 220px));
    }
    body.cc-off .transcript-panel { bottom:136px; }
  }

  @media (max-width: 1380px) and (min-width: 1000px) {
    .slide { width:calc(100vw - 150px); padding:42px 42px 40px; }
    .bottom {
      grid-template-columns:90px minmax(520px,1fr) minmax(270px,320px) 70px;
      gap:10px;
    }
    .top-actions button { padding-left:10px; padding-right:10px; }
    .title-wrap { min-width:210px; }
  }
</style>'''

          start = s.find('<style id="ian620-small-screen-fix">')
          if start != -1:
              end = s.find('</style>', start)
              if end == -1:
                  raise SystemExit('Found small-screen style start but not closing style tag')
              s = s[:start] + css + s[end + len('</style>'):]
          else:
              s = s.replace('</head>', css + '\n</head>')

          # Remove the old intrusive 1200px wrapping for desktop/laptop widths.
          s = s.replace('@media(max-width:1200px){.app{grid-template-rows:auto minmax(0,1fr) 188px}body.cc-off .app{grid-template-rows:auto minmax(0,1fr) 146px}.bottombar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto}.audio-block{grid-column:1/-1}.bottom-nav{grid-column:2;grid-row:2}}', '')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-s-module6-small-screen.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s_module6.html .github/workflows/patch-s-module6-small-screen.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve Module 6 small-screen layout"
          git push
