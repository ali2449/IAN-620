name: Patch Module 6 small-screen layout

"on":
  push:
    paths:
      - ".github/workflows/patch-s-module6-small-screen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply small-screen CSS patch
        env:
          CSS_B64: ""
        run: |
          python3 <<'PY'
          import base64, os
          from pathlib import Path

          p = Path('s_module6.html')
          s = p.read_text(encoding='utf-8')
          css = base64.b64decode(os.environ['CSS_B64']).decode('utf-8')

          start = s.find('<style id="ian620-small-screen-fix">')
          if start != -1:
              end = s.find('</style>', start)
              if end == -1:
                  raise SystemExit('Could not find closing style tag for existing small-screen patch')
              s = s[:start] + css + s[end + len('</style>'):]
          else:
              s = s.replace('</head>', css + '\n</head>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/patch-s-module6-small-screen.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s_module6.html .github/workflows/patch-s-module6-small-screen.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Improve Module 6 small-screen layout"
          git push
