name: Patch Module 6 auto-hide toggle 2

on:
  push:
    paths:
      - .github/workflows/patch-module6-autohide-toggle2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add auto-hide toggle
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('s_module6.html')
          s = p.read_text(encoding='utf-8')
          css = r'''<style id="ian620-autohide-toggle-style">
  @media (min-width: 900px) {
    #autoHideBtn { min-width:118px; }
    #autoHideBtn[aria-pressed="true"] { background:#1764a6; color:#fff; border-color:#1764a6; }
    body.no-auto-hide { padding-bottom:0; overflow:hidden; }
    body.no-auto-hide .deck { height:calc(100vh - 52px - var(--footerExpanded,152px)) !important; min-height:0 !important; padding:12px 0 !important; overflow:hidden !important; align-items:center !important; }
    body.no-auto-hide.cc-off .deck { height:calc(100vh - 52px - 112px) !important; }
    body.no-auto-hide .slide { height:100% !important; max-height:none !important; min-height:0 !important; overflow-y:auto !important; overflow-x:hidden !important; scrollbar-width:thin; }
    body.no-auto-hide .bottom, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) { height:var(--footerExpanded,152px) !important; display:grid !important; grid-template-columns:92px minmax(580px,1fr) minmax(300px,360px) 72px !important; gap:12px !important; align-items:center !important; padding:8px 14px 10px !important; overflow:visible !important; box-shadow:0 -12px 34px rgba(15,23,42,.12) !important; background:var(--panel) !important; }
    body.no-auto-hide.cc-off .bottom, body.no-auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) { height:112px !important; }
    body.no-auto-hide .bottom .footer-left, body.no-auto-hide .bottom .footer-right, body.no-auto-hide .bottom .narration-controls, body.no-auto-hide .bottom .audio-player, body.no-auto-hide .bottom .bottom-nav, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-left, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .footer-right, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .narration-controls, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-player, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .bottom-nav { opacity:1 !important; visibility:visible !important; transform:none !important; max-height:140px !important; pointer-events:auto !important; overflow:visible !important; }
    body.no-auto-hide .bottom .audio-block, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-block { display:grid !important; grid-column:auto !important; width:auto !important; min-width:0 !important; gap:6px !important; align-self:center !important; }
    body.no-auto-hide .bottom .caption-strip, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .caption-strip { width:auto !important; margin:0 !important; height:44px !important; min-height:44px !important; display:flex !important; box-shadow:none !important; }
    body.no-auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) .audio-block::after { content:none !important; display:none !important; }
    body.no-auto-hide .transcript-panel { bottom:calc(var(--footerExpanded,152px) + 14px) !important; }
    body.no-auto-hide.cc-off .transcript-panel { bottom:126px !important; }
    @media (max-height: 900px) {
      body.no-auto-hide .deck { height:calc(100vh - 50px - var(--footerExpandedShort,144px)) !important; padding:8px 0 !important; }
      body.no-auto-hide.cc-off .deck { height:calc(100vh - 50px - 108px) !important; }
      body.no-auto-hide .bottom, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) { height:var(--footerExpandedShort,144px) !important; padding:7px 14px 8px !important; }
      body.no-auto-hide.cc-off .bottom, body.no-auto-hide.cc-off .bottom:not(:hover):not(:focus-within):not(.force-open) { height:108px !important; }
      body.no-auto-hide .bottom .caption-strip, body.no-auto-hide .bottom:not(:hover):not(:focus-within):not(.force-open) .caption-strip { height:38px !important; min-height:38px !important; }
      body.no-auto-hide .transcript-panel { bottom:calc(var(--footerExpandedShort,144px) + 12px) !important; }
      body.no-auto-hide.cc-off .transcript-panel { bottom:118px !important; }
    }
  }
  @media (max-width: 899px) { #autoHideBtn { display:none; } }
</style>'''
          start = s.find('<style id="ian620-autohide-toggle-style">')
          if start != -1:
              end = s.find('</style>', start)
              s = s[:start] + css + s[end + len('</style>'):]
          else:
              s = s.replace('</head>', css + '\n</head>')
          button = '<button id="autoHideBtn" type="button" aria-pressed="true" onclick="toggleAutoHide()">Auto-hide On</button>'
          if 'id="autoHideBtn"' not in s:
              s = s.replace('<button id="themeBtn">Dark mode</button>', button + '\n<button id="themeBtn">Dark mode</button>')
          js = r'''<script id="ian620-autohide-toggle-script">
(function(){
  const KEY = 'ian620_module6_auto_hide';
  const btn = document.getElementById('autoHideBtn');
  function isEnabled(){ return localStorage.getItem(KEY) !== 'off'; }
  function applyAutoHide(){
    const enabled = isEnabled();
    document.body.classList.toggle('no-auto-hide', !enabled);
    const footer = document.querySelector('.bottom');
    if (footer && !enabled) footer.classList.remove('force-open');
    if (btn) {
      btn.textContent = enabled ? 'Auto-hide On' : 'Auto-hide Off';
      btn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      btn.title = enabled ? 'Auto-hide is enabled. Only captions stay visible until you hover near the bottom.' : 'Auto-hide is disabled. The full narration panel stays visible and the slide fits above it.';
    }
  }
  window.toggleAutoHide = function(){
    const nextEnabled = !isEnabled();
    localStorage.setItem(KEY, nextEnabled ? 'on' : 'off');
    applyAutoHide();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyAutoHide); else applyAutoHide();
})();
</script>'''
          start = s.find('<script id="ian620-autohide-toggle-script">')
          if start != -1:
              end = s.find('</script>', start)
              s = s[:start] + js + s[end + len('</script>'):]
          else:
              s = s.replace('</body>', js + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove workflow
        run: rm -f .github/workflows/patch-module6-autohide-toggle2.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add s_module6.html .github/workflows/patch-module6-autohide-toggle2.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add auto-hide toggle for Module 6 slides"
          git push
